; ALL-INKL / PHP-FPM — large per-file uploads + multi-select (15 images + 15 videos)
; Sequential staging: one file per request; headroom for a single ~500 MB video.
upload_max_filesize = 520M
post_max_size = 576M
max_file_uploads = 40
max_execution_time = 1200
max_input_time = 1200
memory_limit = 768M
