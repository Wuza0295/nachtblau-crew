<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover, maximum-scale=1.0, user-scalable=no">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="theme-color" content="#080610">
  <title>Twilight Crown — Krone der Dämmerung</title>
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <div id="game-wrapper">
    <canvas id="game" width="256" height="224"></canvas>
    <button type="button" id="btn-fullscreen" title="Vollbild (F)" aria-label="Vollbild" aria-pressed="false"></button>
    <div id="touch-controls">
      <div class="dpad">
        <button type="button" class="dpad-btn dpad-up" data-dir="up" aria-label="Oben">▲</button>
        <button type="button" class="dpad-btn dpad-left" data-dir="left" aria-label="Links">◀</button>
        <button type="button" class="dpad-btn dpad-center" aria-hidden="true"></button>
        <button type="button" class="dpad-btn dpad-right" data-dir="right" aria-label="Rechts">▶</button>
        <button type="button" class="dpad-btn dpad-down" data-dir="down" aria-label="Unten">▼</button>
      </div>
      <div class="action-pad">
        <button type="button" class="action-btn action-attack" data-action="attack" aria-label="Schwert / Reden">A</button>
        <button type="button" class="action-btn action-item" data-action="item" aria-label="Item">B</button>
        <button type="button" class="action-btn action-pause" data-action="pause" aria-label="Pause">☰</button>
      </div>
    </div>
    <div id="overlay">
      <div id="title-screen" class="hidden" aria-hidden="true"></div>
      <div id="game-over" class="hidden">
        <h2>DÄMMERUNG</h2>
        <p>Dein Licht erlischt…</p>
        <p class="blink">A / Enter — Zum Titel</p>
      </div>
      <div id="victory" class="hidden">
        <h2>TWILIGHT CROWN</h2>
        <p>Die Krone der Dämmerung leuchtet wieder!</p>
        <p class="blink">A / Enter — Zum Titel</p>
      </div>
    </div>
  </div>
  <script type="module" src="js/main.js?v=20260805b"></script>
</body>
</html>
