<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" fill="none">
  <defs>
    <linearGradient id="sky" x1="800" y1="0" x2="800" y2="520" gradientUnits="userSpaceOnUse">
      <stop stop-color="#1a1040"/>
      <stop offset="0.55" stop-color="#3a2060"/>
      <stop offset="1" stop-color="#ff9a6a"/>
    </linearGradient>
    <linearGradient id="road" x1="800" y1="400" x2="800" y2="900" gradientUnits="userSpaceOnUse">
      <stop stop-color="#686880"/>
      <stop offset="1" stop-color="#484858"/>
    </linearGradient>
    <linearGradient id="grass" x1="0" y1="500" x2="1600" y2="900" gradientUnits="userSpaceOnUse">
      <stop stop-color="#1c5a30"/>
      <stop offset="1" stop-color="#0e3a1c"/>
    </linearGradient>
    <radialGradient id="glow" cx="0" cy="0" r="1" gradientUnits="userSpaceOnUse" gradientTransform="translate(800 380) rotate(90) scale(220)">
      <stop stop-color="#7ec8ff" stop-opacity="0.45"/>
      <stop offset="1" stop-color="#7ec8ff" stop-opacity="0"/>
    </radialGradient>
  </defs>
  <rect width="1600" height="900" fill="url(#sky)"/>
  <!-- stars -->
  <g fill="#fff" opacity="0.55">
    <circle cx="180" cy="80" r="2"/>
    <circle cx="320" cy="140" r="1.5"/>
    <circle cx="520" cy="60" r="2"/>
    <circle cx="1100" cy="90" r="1.5"/>
    <circle cx="1280" cy="130" r="2"/>
    <circle cx="1450" cy="70" r="1.5"/>
    <circle cx="900" cy="50" r="1"/>
  </g>
  <circle cx="800" cy="380" r="160" fill="url(#glow)"/>
  <!-- Mode-7 ground plane -->
  <path d="M0 480 L800 420 L1600 480 L1600 900 L0 900Z" fill="url(#grass)"/>
  <!-- perspective road -->
  <path d="M620 900 L760 460 L840 460 L980 900Z" fill="url(#road)"/>
  <path d="M790 460 L810 460 L820 900 L780 900Z" fill="#e8dcc0" opacity="0.55"/>
  <!-- checkered near -->
  <g opacity="0.25">
    <rect x="0" y="700" width="200" height="100" fill="#2a7040"/>
    <rect x="400" y="700" width="200" height="100" fill="#2a7040"/>
    <rect x="1000" y="700" width="200" height="100" fill="#2a7040"/>
    <rect x="1400" y="700" width="200" height="100" fill="#2a7040"/>
  </g>
  <!-- item boxes -->
  <rect x="640" y="560" width="28" height="28" fill="#6ec8ff" transform="rotate(-8 654 574)"/>
  <rect x="930" y="540" width="26" height="26" fill="#6ec8ff" transform="rotate(10 943 553)"/>
  <rect x="648" y="568" width="12" height="12" fill="#ffe566" transform="rotate(-8 654 574)"/>
  <!-- dual kart (Double Dash) -->
  <g transform="translate(760 700)">
    <ellipse cx="40" cy="52" rx="48" ry="10" fill="#000" opacity="0.35"/>
    <rect x="8" y="18" width="64" height="36" rx="4" fill="#7ec8ff"/>
    <rect x="14" y="22" width="22" height="16" fill="#e8f4ff"/>
    <rect x="42" y="22" width="22" height="16" fill="#6b5cff"/>
    <rect x="0" y="40" width="10" height="14" fill="#1a1a22"/>
    <rect x="70" y="40" width="10" height="14" fill="#1a1a22"/>
    <!-- mini-turbo sparks -->
    <rect x="-6" y="46" width="6" height="6" fill="#ffe566"/>
    <rect x="80" y="46" width="6" height="6" fill="#7ec8ff"/>
  </g>
</svg>
