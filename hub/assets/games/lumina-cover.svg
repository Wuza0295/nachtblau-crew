      <stop offset="0.45" stop-color="#07102a"/>
      <stop offset="1" stop-color="#0a1838"/>
    </linearGradient>
    <linearGradient id="horizon" x1="800" y1="420" x2="800" y2="900" gradientUnits="userSpaceOnUse">
