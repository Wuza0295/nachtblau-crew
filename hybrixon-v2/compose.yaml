name: hybrixon-v2

services:
  postgres:
    image: postgres:18-alpine
    environment:
      POSTGRES_DB: hybrixon
      POSTGRES_USER: hybrixon
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-hybrixon-local-only}
    volumes:
      - postgres-data:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U hybrixon -d hybrixon"]
      interval: 5s
      timeout: 3s
      retries: 20

  redis:
    image: redis:8.2-alpine
    command: redis-server --appendonly yes --maxmemory-policy noeviction
    volumes:
      - redis-data:/data
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 20

  minio:
    image: minio/minio:latest
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${S3_ACCESS_KEY:-hybrixon}
      MINIO_ROOT_PASSWORD: ${S3_SECRET_KEY:-hybrixon-local-secret-change-me}
    volumes:
      - minio-data:/data
    ports:
      - "9000:9000"
      - "9001:9001"
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 5s
      timeout: 3s
      retries: 20

  minio-init:
    image: minio/mc:latest
    depends_on:
      minio:
        condition: service_healthy
    entrypoint: >
      /bin/sh -c "
      mc alias set local http://minio:9000 ${S3_ACCESS_KEY:-hybrixon} ${S3_SECRET_KEY:-hybrixon-local-secret-change-me};
      mc mb --ignore-existing local/hybrixon-media;
      mc anonymous set download local/hybrixon-media;
      exit 0;"

  api:
    build:
      context: .
      dockerfile: apps/api/Dockerfile
    environment: &backend-env
      NODE_ENV: production
      PORT: 8080
      DATABASE_URL: postgresql://hybrixon:${POSTGRES_PASSWORD:-hybrixon-local-only}@postgres:5432/hybrixon
      REDIS_URL: redis://redis:6379
      JWT_SECRET: ${JWT_SECRET:-development-jwt-secret-change-before-production}
      CORS_ORIGINS: ${CORS_ORIGINS:-http://localhost:8081,http://localhost:5173}
      S3_ENDPOINT: http://minio:9000
      S3_REGION: eu-central-1
      S3_BUCKET: hybrixon-media
      S3_ACCESS_KEY: ${S3_ACCESS_KEY:-hybrixon}
      S3_SECRET_KEY: ${S3_SECRET_KEY:-hybrixon-local-secret-change-me}
      S3_FORCE_PATH_STYLE: "true"
      CDN_BASE_URL: ${CDN_BASE_URL:-http://localhost:9000/hybrixon-media}
      MEDIA_TMP_DIR: /tmp/hybrixon-media
    command: >
      sh -c "pnpm --filter @hybrixon/api db:migrate &&
      pnpm --filter @hybrixon/api start"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      minio-init:
        condition: service_completed_successfully
    ports:
      - "8080:8080"

  worker:
    build:
      context: .
      dockerfile: apps/worker/Dockerfile
    environment: *backend-env
    depends_on:
      api:
        condition: service_started

  web:
    build:
      context: .
      dockerfile: apps/web/Dockerfile
      args:
        VITE_API_URL: ${VITE_API_URL:-http://localhost:8080/v2}
    depends_on:
      - api
    ports:
      - "8081:80"

volumes:
  postgres-data:
  redis-data:
  minio-data:
