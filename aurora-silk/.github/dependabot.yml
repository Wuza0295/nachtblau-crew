# Nested config (falls aurora-silk als eigenes Repo genutzt wird).
# Base-Image aurora:stable wird bewusst NICHT per Dependabot/Digest gepinnt –
# täglicher CI-Rebuild mit --pull=always trackt Upstream.
# https://docs.github.com/github/administering-a-repository/configuration-options-for-dependency-updates

version: 2
updates:
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 5
