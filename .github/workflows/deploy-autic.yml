name: Deploy Autic Treasures (ALL-INKL)

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "client/**"
      - "shared/**"
      - "scripts/deploy-webspace.py"
      - ".github/workflows/deploy-autic.yml"

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
      - run: npm ci
      - run: npm run build
      # Hauptdomain: FTP-Account mit /autic-treasures.com (Secrets: FTP_*)
      - name: Deploy to autic-treasures.com
        env:
          FTP_HOST: ${{ secrets.FTP_HOST }}
          FTP_USER: ${{ secrets.FTP_USER }}
          FTP_PASS: ${{ secrets.FTP_PASS }}
          FTP_REMOTE_DIR: /autic-treasures.com
          FTP_TLS: "1"
        run: python3 scripts/deploy-webspace.py
      # Subdomain: eigener FTP-Login (Secrets FTP_*_SUBDOMAIN, Fallback FTP_*)
      - name: Deploy to autictreasures.nacht-blau.de
        env:
          FTP_HOST: ${{ secrets.FTP_HOST }}
          FTP_USER: ${{ secrets.FTP_USER_SUBDOMAIN }}
          FTP_PASS: ${{ secrets.FTP_PASS_SUBDOMAIN }}
          FTP_USER_FALLBACK: ${{ secrets.FTP_USER }}
          FTP_PASS_FALLBACK: ${{ secrets.FTP_PASS }}
          FTP_REMOTE_DIR: /autictreasures.nacht-blau.de
          FTP_TLS: "1"
        run: |
          export FTP_USER="${FTP_USER:-$FTP_USER_FALLBACK}"
          export FTP_PASS="${FTP_PASS:-$FTP_PASS_FALLBACK}"
          python3 scripts/deploy-webspace.py
