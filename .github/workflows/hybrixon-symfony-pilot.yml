name: Hybrixon Symfony pilot

on:
  pull_request:
    paths:
      - 'experiments/hybrixon-symfony-pilot/**'
      - '.github/workflows/hybrixon-symfony-pilot.yml'
  workflow_dispatch:

jobs:
  health-route:
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: experiments/hybrixon-symfony-pilot
    steps:
      - uses: actions/checkout@v4
      - name: Set up PHP 8.5 and Composer
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.5'
          coverage: none
          tools: composer:v2
      - name: Install locked pilot dependencies
        run: composer install --no-interaction --prefer-dist
      - name: Validate Composer metadata
        run: composer validate --no-check-publish
      - name: Start pilot and verify GET /health
        shell: bash
        run: |
          set -euo pipefail
          APP_ENV=test APP_DEBUG=1 APP_SECRET=ci-pilot-secret \
            php -S 127.0.0.1:8001 -t public public/index.php >/tmp/hybrixon-pilot.log 2>&1 &
          server_pid=$!
          trap 'kill "$server_pid" 2>/dev/null || true' EXIT

          http_code=''
          for attempt in $(seq 1 20); do
            http_code=$(curl --silent --show-error --output /tmp/hybrixon-health.json \
              --write-out '%{http_code}' http://127.0.0.1:8001/health || true)
            if [ "$http_code" = "200" ]; then
              break
            fi
            sleep 1
          done

          if [ "$http_code" != "200" ]; then
            echo "Health endpoint returned HTTP ${http_code:-no-response}"
            cat /tmp/hybrixon-pilot.log
            cat /tmp/hybrixon-health.json 2>/dev/null || true
            exit 1
          fi

          cat /tmp/hybrixon-health.json
          jq -e '
            .ok == true and
            .engine == "hybrixon-symfony-pilot-7.4" and
            (.php | startswith("8.5")) and
            .mode == "isolated-pilot"
          ' /tmp/hybrixon-health.json
