name: Lumina Android APK

on:
  push:
    paths:
      - "android/nachtblau-hub/**"
      - ".github/workflows/android-launcher.yml"
  pull_request:
    paths:
      - "android/nachtblau-hub/**"
      - ".github/workflows/android-launcher.yml"
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - name: Setup Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: |
            platform-tools
            platforms;android-34
            build-tools;34.0.0
      - name: Build debug APK
        working-directory: android/nachtblau-hub
        run: ./gradlew assembleDebug --no-daemon
      - name: Name APK for phone install
        run: |
          mkdir -p dist
          cp android/nachtblau-hub/app/build/outputs/apk/debug/app-debug.apk dist/Lumina.apk
      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: lumina-android-apk
          path: dist/Lumina.apk
