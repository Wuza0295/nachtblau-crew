name: Android Launcher

on:
  push:
    paths:
      - "android/nachtblau-hub/**"
      - ".github/workflows/android-launcher.yml"
  pull_request:
    paths:
      - "android/nachtblau-hub/**"
      - ".github/workflows/android-launcher.yml"

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - name: Setup Android SDK
        uses: android-actions/setup-android@v3
      - name: Build debug APK
        working-directory: android/nachtblau-hub
        run: ./gradlew assembleDebug --no-daemon
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: nachtblau-hub-debug
          path: android/nachtblau-hub/app/build/outputs/apk/debug/app-debug.apk
