name: Webspace Sync (all domains)

on:
  workflow_dispatch:

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 10

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Inject partner banner into all local domains
        run: python3 scripts/inject-partner-banner.py

      - name: Build Allxion for /allxion/
        run: pnpm webspace:build-allxion
        env:
          VITE_API_ORIGIN: ${{ secrets.VITE_API_ORIGIN }}

      - name: Upload all webspace domains to ALL-INKL (FTPS)
        env:
          FTP_HOST: ${{ secrets.FTP_HOST }}
          FTP_USER: ${{ secrets.FTP_USER }}
          FTP_PASS: ${{ secrets.FTP_PASS }}
          FTP_TLS: "1"
        run: |
          if [ -z "$FTP_USER" ] || [ -z "$FTP_PASS" ]; then
            echo "::error::Repository secrets FTP_USER and FTP_PASS are required."
            exit 1
          fi
          export FTP_HOST="${FTP_HOST:-w02176b7.kasserver.com}"
          python3 scripts/sync-webspace.py
