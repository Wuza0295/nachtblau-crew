name: Deploy Hybrixon CSS (ALL-INKL)

on:
  workflow_dispatch:
  push:
    branches: [cursor/hybrixon-topbar-fix-696c]
    paths:
      - "webspace/hybrixon.com/assets/css/style.css"
      - "webspace/hybrixon.com/assets/js/app.js"
      - "scripts/deploy-hybrixon-css.py"
      - ".github/workflows/deploy-hybrixon-css.yml"

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Deploy and verify Hybrixon CSS + JS via FTPS
        env:
          FTP_HOST: ${{ secrets.FTP_HOST }}
          FTP_USER: ${{ secrets.FTP_USER }}
          FTP_PASS: ${{ secrets.FTP_PASS }}
          FTP_TLS: "1"
        run: |
          if [ -z "$FTP_HOST" ] || [ -z "$FTP_USER" ] || [ -z "$FTP_PASS" ]; then
            echo "::error::FTP_HOST, FTP_USER und FTP_PASS müssen als Repository Actions Secrets gesetzt sein."
            exit 1
          fi
          python3 scripts/deploy-hybrixon-css.py
