name: Build Silk image
on:
  pull_request:
    paths:
      - 'silk/**'
      - '.github/workflows/silk-build.yml'
  push:
    branches:
      - main
      - 'cursor/aurora-silk-os-2818'
    paths:
      - 'silk/**'
      - '.github/workflows/silk-build.yml'
  workflow_dispatch:
    inputs:
      push_image:
        description: 'Image nach GHCR pushen'
        type: boolean
        default: true
      build_nvidia:
        description: 'Auch silk-nvidia-open bauen'
        type: boolean
        default: false
  schedule:
    - cron: '05 10 * * *'

env:
  IMAGE_REGISTRY: "ghcr.io/${{ github.repository_owner }}"

# WICHTIG: kein matrix.* hier – sonst scheitert der Workflow sofort
concurrency:
  group: silk-${{ github.workflow }}-${{ github.ref || github.run_id }}
  cancel-in-progress: true

defaults:
  run:
    working-directory: silk

jobs:
  offline_tests:
    name: Offline script tests
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Install jq
        run: sudo apt-get update -qq && sudo apt-get install -y -qq jq
        working-directory: .
      - name: Run offline tests
        run: bash tests/run-offline-tests.sh

  build_push:
    name: Build ${{ matrix.image_name }}
    needs: offline_tests
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        include:
          - image_name: silk
            base_image: ghcr.io/ublue-os/aurora:stable
          - image_name: silk-nvidia-open
            base_image: ghcr.io/ublue-os/aurora-nvidia-open:stable
    permissions:
      contents: read
      packages: write
      id-token: write
    steps:
      - name: Maybe skip NVIDIA
        id: gate
        working-directory: .
        run: |
          if [[ "${{ matrix.image_name }}" == "silk-nvidia-open" ]]; then
            if [[ "${{ github.event_name }}" == "workflow_dispatch" && "${{ inputs.build_nvidia }}" != "true" ]]; then
              echo "skip=true" >> "$GITHUB_OUTPUT"
              echo "NVIDIA-Build übersprungen (build_nvidia=false)."
            else
              echo "skip=false" >> "$GITHUB_OUTPUT"
            fi
          else
            echo "skip=false" >> "$GITHUB_OUTPUT"
          fi

      - uses: actions/checkout@v4
        if: steps.gate.outputs.skip != 'true'

      - name: Maximize build space
        if: steps.gate.outputs.skip != 'true'
        uses: ublue-os/remove-unwanted-software@695eb75bc387dbcd9685a8e72d23439d8686cba6

      - name: Install just
        if: steps.gate.outputs.skip != 'true'
        uses: extractions/setup-just@v2

      - name: Check Just Syntax
        if: steps.gate.outputs.skip != 'true'
        run: just check

      - name: Default Tag
        if: steps.gate.outputs.skip != 'true'
        run: |
          DEFAULT_TAG=$(just generate-default-tag)
          echo "DEFAULT_TAG=${DEFAULT_TAG}" >> $GITHUB_ENV

      - name: Prepare environment
        if: steps.gate.outputs.skip != 'true'
        working-directory: .
        run: |
          echo "IMAGE_REGISTRY=${IMAGE_REGISTRY,,}" >> ${GITHUB_ENV}
          echo "IMAGE_NAME=${{ matrix.image_name }}" >> ${GITHUB_ENV}

      - name: Pull Aurora base (${{ matrix.base_image }})
        if: steps.gate.outputs.skip != 'true'
        run: podman pull ${{ matrix.base_image }}

      - name: Build Image
        if: steps.gate.outputs.skip != 'true'
        run: just build ${IMAGE_NAME} ${DEFAULT_TAG} ${{ matrix.base_image }}

      - name: Rechunk with rpm-ostree
        if: steps.gate.outputs.skip != 'true'
        continue-on-error: true
        run: just ostree-rechunk ${IMAGE_NAME} ${DEFAULT_TAG}

      - name: Generate Build Tags
        if: steps.gate.outputs.skip != 'true'
        id: gen-build-tags
        run: |
          alias_tags="$(just generate-build-tags ${IMAGE_NAME} ${DEFAULT_TAG})"
          echo "alias_tags=${alias_tags}" >> $GITHUB_OUTPUT

      - name: Tag Image
        if: steps.gate.outputs.skip != 'true'
        env:
          ALIAS_TAGS: ${{ steps.gen-build-tags.outputs.alias_tags }}
        run: just tag-images "${IMAGE_NAME}" "${DEFAULT_TAG}" "${ALIAS_TAGS}"

      - name: Decide push
        if: steps.gate.outputs.skip != 'true'
        id: should-push
        working-directory: .
        run: |
          PUSH=false
          if [[ "${{ github.event_name }}" == "pull_request" ]]; then
            PUSH=false
          elif [[ "${{ github.event_name }}" == "workflow_dispatch" && "${{ inputs.push_image }}" == "true" ]]; then
            PUSH=true
          elif [[ "${{ github.ref }}" == "refs/heads/${{ github.event.repository.default_branch }}" ]]; then
            PUSH=true
          elif [[ "${{ github.ref }}" == "refs/heads/cursor/aurora-silk-os-2818" ]]; then
            PUSH=true
          fi
          echo "push=${PUSH}" >> "$GITHUB_OUTPUT"
          echo "Push-Entscheidung: ${PUSH}"

      - name: Login to GitHub Container Registry
        uses: docker/login-action@v3
        if: steps.gate.outputs.skip != 'true' && steps.should-push.outputs.push == 'true'
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Push To GHCR
        if: steps.gate.outputs.skip != 'true' && steps.should-push.outputs.push == 'true'
        id: push-image
        env:
          ALIAS_TAGS: ${{ steps.gen-build-tags.outputs.alias_tags }}
        run: |
          set -euox pipefail
          for tag in ${ALIAS_TAGS}; do
            podman push --digestfile=/tmp/digestfile ${IMAGE_NAME}:${tag} ${IMAGE_REGISTRY}/${IMAGE_NAME}:${tag}
          done
          digest=$(< /tmp/digestfile)
          echo "digest=${digest}" >> $GITHUB_OUTPUT

      - name: Install Cosign
        uses: sigstore/cosign-installer@v3
        if: steps.gate.outputs.skip != 'true' && steps.should-push.outputs.push == 'true'

      - name: Sign container image
        if: steps.gate.outputs.skip != 'true' && steps.should-push.outputs.push == 'true'
        env:
          COSIGN_PRIVATE_KEY: ${{ secrets.SIGNING_SECRET }}
          DIGEST: ${{ steps.push-image.outputs.digest }}
        run: |
          if [[ -z "${COSIGN_PRIVATE_KEY}" ]]; then
            echo "Kein SIGNING_SECRET – Signatur übersprungen."
            echo "Test-Switch ohne Enforce: sudo bootc switch ${IMAGE_REGISTRY}/${IMAGE_NAME}:latest"
            exit 0
          fi
          cosign sign -y --new-bundle-format=false --use-signing-config=false --key env://COSIGN_PRIVATE_KEY ${IMAGE_REGISTRY}/${IMAGE_NAME}@${DIGEST}
