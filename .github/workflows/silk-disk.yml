name: Build Silk install media
# Eigenständiges Silk-ISO + QCOW2 aus ghcr.io/wuza0295/silk:latest
# Kein Aurora-User-Pfad – nur Silk-Installer für VirtualBox/USB.

on:
  workflow_dispatch:
    inputs:
      create_release:
        description: 'GitHub Release mit ISO/QCOW anlegen'
        type: boolean
        default: true
  workflow_run:
    workflows: ["Build Silk image"]
    types: [completed]
    branches: [main, cursor/aurora-silk-os-2818]
  push:
    branches: [cursor/aurora-silk-os-2818, main]
    paths:
      - 'silk/disk_config/**'
      - '.github/workflows/silk-disk.yml'

concurrency:
  group: silk-disk-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: write
  packages: read
  actions: read

env:
  BIB_IMAGE: quay.io/centos-bootc/bootc-image-builder:latest
  SILK_IMAGE: ghcr.io/wuza0295/silk:latest

jobs:
  gate:
    name: Gate (Silk image ready)
    runs-on: ubuntu-24.04
    outputs:
      should_build: ${{ steps.check.outputs.should_build }}
    steps:
      - id: check
        run: |
          if [[ "${{ github.event_name }}" == "workflow_run" && "${{ github.event.workflow_run.conclusion }}" != "success" ]]; then
            echo "should_build=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          sudo apt-get update -qq && sudo apt-get install -y -qq skopeo
          if skopeo inspect "docker://${SILK_IMAGE}" >/dev/null; then
            echo "should_build=true" >> "$GITHUB_OUTPUT"
          else
            echo "should_build=false" >> "$GITHUB_OUTPUT"
            echo "${SILK_IMAGE} nicht erreichbar"
          fi

  build_media:
    name: Build ${{ matrix.type }}
    needs: gate
    if: needs.gate.outputs.should_build == 'true'
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        include:
          - type: anaconda-iso
            config: silk/disk_config/iso.toml
            artifact: silk-installer
            outname: Silk-Installer-x86_64.iso
          - type: qcow2
            config: silk/disk_config/disk.toml
            artifact: silk-vm
            outname: Silk-VM-x86_64.qcow2
    steps:
      - uses: actions/checkout@v4

      - name: Maximize build space
        uses: ublue-os/remove-unwanted-software@cc0becac701cf642c8f0a6613bbdaf5dc36b259e
        with:
          remove-codeql: true

      - name: Install podman
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq podman

      - name: Build with bootc-image-builder (absolute mounts)
        run: |
          set -euo pipefail
          CFG="$(pwd)/${{ matrix.config }}"
          OUT="$(pwd)/bib-output"
          mkdir -p "$OUT"
          test -f "$CFG"
          echo "Config: $CFG"
          echo "Output: $OUT"
          echo "Image:  ${SILK_IMAGE}"

          # Image lokal cachen
          sudo podman pull "${SILK_IMAGE}"
          sudo podman pull "${BIB_IMAGE}"

          # BIB depsolvt Fedora-Repos anhand VERSION_ID aus dem Container.
          # Altes Silk-Branding setzte VERSION_ID=1.0 → Metalink fedora-1.0 (404).
          # Deshalb: lokale Ableitung mit ID=fedora + echter Fedora-VERSION_ID.
          FEDORA_VER="$(
            sudo podman run --rm --entrypoint /bin/bash "${BIB_IMAGE}" -c \
              'ls /usr/share/bootc-image-builder/defs/fedora-*.yaml 2>/dev/null | sort -V | tail -1 | grep -oE "[0-9]+" | tail -1' \
            || true
          )"
          FEDORA_VER="${FEDORA_VER:-42}"
          echo "BIB Fedora-Def-Version: ${FEDORA_VER}"

          # Containerfile ohne YAML-Einrückung schreiben (sonst bricht FROM)
          {
            echo "FROM ${SILK_IMAGE}"
            echo "RUN set -eux; \\"
            echo "  for f in /usr/lib/os-release /etc/os-release; do \\"
            echo "    [ -e \"\$f\" ] || continue; \\"
            echo "    if [ -L \"\$f\" ]; then rm -f \"\$f\"; fi; \\"
            echo "  done; \\"
            echo "  if [ ! -f /etc/os-release ] && [ -f /usr/lib/os-release ]; then cp -a /usr/lib/os-release /etc/os-release; fi; \\"
            echo "  for f in /usr/lib/os-release /etc/os-release; do \\"
            echo "    [ -f \"\$f\" ] || continue; \\"
            echo "    sed -i \\"
            echo "      -e 's/^NAME=.*/NAME=\"Silk\"/' \\"
            echo "      -e 's/^PRETTY_NAME=.*/PRETTY_NAME=\"Silk\"/' \\"
            echo "      -e 's/^ID=.*/ID=fedora/' \\"
            echo "      -e 's/^VERSION_ID=.*/VERSION_ID=\"${FEDORA_VER}\"/' \\"
            echo "      -e 's/^VARIANT=.*/VARIANT=\"Silk\"/' \\"
            echo "      -e 's/^VARIANT_ID=.*/VARIANT_ID=silk/' \\"
            echo "      \"\$f\"; \\"
            echo "  done; \\"
            echo "  grep -E '^(NAME|ID|VERSION_ID|VARIANT)=' /usr/lib/os-release"
          } > /tmp/Containerfile.silk-bib
          echo "---- Containerfile.silk-bib ----"
          cat /tmp/Containerfile.silk-bib
          sudo podman build --layers=false -t localhost/silk-bib:latest -f /tmp/Containerfile.silk-bib
          BIB_SRC="localhost/silk-bib:latest"

          # WICHTIG: absolute Host-Pfade, sonst erzeugt Podman Named Volumes
          # und /config.toml landet als Verzeichnis → Build stirbt.
          sudo podman run --rm --privileged \
            --security-opt label=type:unconfined_t \
            -v /var/lib/containers/storage:/var/lib/containers/storage \
            -v "${OUT}:/output" \
            -v "${CFG}:/config.toml:ro" \
            --entrypoint /bin/bash \
            "${BIB_IMAGE}" \
            -c "
              set -euo pipefail
              DEFS=/usr/share/bootc-image-builder/defs
              if [[ -d \"\$DEFS\" ]]; then
                FED=\$(ls \"\$DEFS\"/fedora-*.yaml 2>/dev/null | sort -V | tail -1 || true)
                if [[ -n \"\$FED\" ]]; then
                  BASE=\$(basename \"\$FED\")
                  for id in aurora silk; do
                    for ver in 1.0 40 41 42 43 44; do
                      ln -sfn \"\$BASE\" \"\$DEFS/\${id}-\${ver}.yaml\"
                    done
                  done
                  echo \"BIB distro aliases → \$BASE\"
                  ls -l \"\$DEFS\"/{aurora,silk}-*.yaml 2>/dev/null || true
                fi
              fi
              exec /usr/bin/bootc-image-builder \
                --type '${{ matrix.type }}' \
                --use-librepo=True \
                --rootfs=btrfs \
                --local \
                '${BIB_SRC}'
            "

          echo "=== bib-output ==="
          find "$OUT" -type f | head -40
          sudo chown -R "$(id -u):$(id -g)" "$OUT" || true

      - name: Collect Silk-branded artifact
        run: |
          set -euo pipefail
          mkdir -p dist
          if [[ "${{ matrix.type }}" == "anaconda-iso" ]]; then
            ISO=$(find bib-output -name '*.iso' -type f | head -1)
            [[ -n "$ISO" ]] || { echo "Kein ISO"; find bib-output -type f; exit 1; }
            cp -f "$ISO" "dist/${{ matrix.outname }}"
          else
            QCOW=$(find bib-output -name '*.qcow2' -type f | head -1)
            [[ -n "$QCOW" ]] || { echo "Kein QCOW2"; find bib-output -type f; exit 1; }
            cp -f "$QCOW" "dist/${{ matrix.outname }}"
          fi
          # Basename-only SHA (sonst scheitert sha256sum -c nach Download)
          (cd dist && sha256sum "${{ matrix.outname }}" | tee "${{ matrix.outname }}.sha256")
          ls -lh dist/

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact }}
          path: dist/*
          if-no-files-found: error
          retention-days: 14
          compression-level: 0

  release:
    name: Publish Silk install media
    needs: build_media
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - name: Download artifacts
        uses: actions/download-artifact@v4
        with:
          path: release-assets
          merge-multiple: true

      - name: List assets
        run: ls -lhR release-assets

      # GitHub Release-API: max. 2 GiB pro Asset → splitten
      - name: Split oversized assets (<2 GiB)
        run: |
          chmod +x silk/scripts/prepare-release-assets.sh
          silk/scripts/prepare-release-assets.sh release-assets
          ls -lhR release-assets

      - name: Create or update Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: silk-media-latest
          name: Silk Install Media
          draft: false
          body: |
            **Silk** – eigenständiges Install-Medium für VirtualBox / USB.

            GitHub erlaubt max. ~2 GiB pro Datei → ISO/QCOW sind ggf. **gesplittet** (`*.part00` …).
            Zusammenfügen: `bash reassemble.sh` oder `cat Silk-Installer-x86_64.iso.part* > Silk-Installer-x86_64.iso`

            ### VirtualBox in einem Befehl
            `bash go-virtualbox.sh` (liegt im Release) – lädt ISO, VM **Silk**, startet VirtualBox.

            Kein Aurora-Download nötig. Image: `ghcr.io/wuza0295/silk:latest`
          files: release-assets/*
          fail_on_unmatched_files: true
          make_latest: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
