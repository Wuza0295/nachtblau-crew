name: Hybrixon v2 CI

on:
  push:
    paths:
      - "hybrixon-v2/**"
      - ".github/workflows/hybrixon-v2-ci.yml"
  pull_request:
    paths:
      - "hybrixon-v2/**"
      - ".github/workflows/hybrixon-v2-ci.yml"

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: hybrixon-v2
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10.4.1
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: hybrixon-v2/pnpm-lock.yaml
      - run: pnpm install --frozen-lockfile
      - run: pnpm check
      - run: pnpm test
      - run: pnpm build
      - uses: actions/upload-artifact@v4
        with:
          name: hybrixon-pwa
          path: hybrixon-v2/apps/web/dist
          if-no-files-found: error
