name: Hybrixon Hosting Monitor

on:
  schedule:
    # Daily 06:15 UTC
    - cron: "15 6 * * *"
  workflow_dispatch:

jobs:
  monitor:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      issues: write
    steps:
      - uses: actions/checkout@v4

      - name: Check ALL-INKL hosting fitness
        id: check
        run: |
          set +e
          python3 scripts/monitor-hybrixon-hosting.py --url "https://hybrixon.com/api/health" | tee /tmp/hosting-monitor.txt
          code=${PIPESTATUS[0]}
          echo "exit_code=$code" >> "$GITHUB_OUTPUT"
          if [ "$code" -eq 0 ]; then
            echo "status=ok" >> "$GITHUB_OUTPUT"
          elif [ "$code" -eq 1 ]; then
            echo "status=watch" >> "$GITHUB_OUTPUT"
          else
            echo "status=migrate" >> "$GITHUB_OUTPUT"
          fi
          exit 0

      - name: Upsert GitHub issue when attention needed
        if: steps.check.outputs.status != 'ok'
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            const status = '${{ steps.check.outputs.status }}';
            const body = fs.readFileSync('/tmp/hosting-monitor.txt', 'utf8');
            const title = status === 'migrate'
              ? 'Hybrixon Hosting: Wechsel von ALL-INKL prüfen'
              : 'Hybrixon Hosting: Wachstum beobachten (ALL-INKL)';
            const marker = '<!-- hybrixon-hosting-monitor -->';
            const issueBody = `${marker}\nAutomatischer Hosting-Check (täglich).\n\n\`\`\`\n${body}\n\`\`\`\n\nAdmin: https://hybrixon.com/admin/hosting.php\nHealth: https://hybrixon.com/api/health\n`;
            const issues = await github.paginate(github.rest.issues.listForRepo, {
              owner: context.repo.owner,
              repo: context.repo.repo,
              state: 'open',
              per_page: 100,
            });
            const existing = issues.find(i => !i.pull_request && (i.body || '').includes(marker));
            if (existing) {
              await github.rest.issues.update({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: existing.number,
                title,
                body: issueBody,
              });
              core.info(`Updated issue #${existing.number}`);
            } else {
              await github.rest.issues.create({
                owner: context.repo.owner,
                repo: context.repo.repo,
                title,
                body: issueBody,
              });
              core.info('Created hosting-monitor issue');
            }

      - name: Fail workflow on migrate/critical
        if: steps.check.outputs.status == 'migrate'
        run: |
          echo "::error::Hosting verdict is migrate — see issue / admin hosting monitor."
          exit 1
