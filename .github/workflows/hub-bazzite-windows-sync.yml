name: Hub Bazzite-Windows Sync

on:
  workflow_dispatch:

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Windows-Seite aus der Bazzite-Seite erzeugen und hochladen
        env:
          FTP_HOST: ${{ secrets.FTP_HOST }}
          FTP_USER: ${{ secrets.FTP_USER }}
          FTP_PASS: ${{ secrets.FTP_PASS }}
          FTP_TLS: "1"
        run: |
          if [ -z "$FTP_USER" ] || [ -z "$FTP_PASS" ]; then
            echo "::error::Repository-Secrets FTP_USER und FTP_PASS fehlen."
            exit 1
          fi
          export FTP_HOST="${FTP_HOST:-w02176b7.kasserver.com}"
          python3 scripts/sync_bazzite_windows.py
