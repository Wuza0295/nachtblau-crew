name: Deploy Webspace Optimierung (ALL-INKL)

on:
  workflow_dispatch:
  push:
    branches: [cursor/webspace-optimierung-5606]
    paths:
      - "webspace/**"
      - "scripts/deploy-webspace-optimierung.py"
      - "scripts/webspace_config.py"
      - ".github/workflows/deploy-webspace-optimierung.yml"

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: FTPS-Deploy nach ALL-INKL
        env:
          FTP_HOST: ${{ secrets.FTP_HOST }}
          FTP_USER: ${{ secrets.FTP_USER }}
          FTP_PASS: ${{ secrets.FTP_PASS }}
          FTP_TLS: "1"
        run: |
          if [ -z "$FTP_USER" ] || [ -z "$FTP_PASS" ]; then
            echo "::warning::FTP_USER / FTP_PASS fehlen — Deploy übersprungen (Secrets unter Settings → Actions setzen)."
            if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
              echo "::error::Manueller Deploy abgebrochen: FTP Secrets erforderlich."
              exit 1
            fi
            exit 0
          fi
          export FTP_HOST="${FTP_HOST:-w02176b7.kasserver.com}"
          python3 scripts/deploy-webspace-optimierung.py
