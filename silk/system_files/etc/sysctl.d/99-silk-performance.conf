# Silk – Performance & Lightweight Defaults (GPU-unabhängig)
# Reduziert Latenz, verbessert Fair-Queue, drosselt Swap-Thrashing

vm.swappiness = 10
vm.vfs_cache_pressure = 50
vm.dirty_ratio = 10
vm.dirty_background_ratio = 5

# Netzwerk: moderne Fair-Queue
net.core.default_qdisc = fq
net.ipv4.tcp_congestion_control = bbr

# Weniger NUMA-Balancing-Overhead auf Desktop/Gaming
kernel.numa_balancing = 0

# Schnellere Prozess-Scheduling-Reaktion
kernel.sched_autogroup_enabled = 1
