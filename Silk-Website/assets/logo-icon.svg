<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" role="img" aria-label="Silk">
  <defs>
    <linearGradient id="silk-a" x1="8" y1="8" x2="56" y2="56" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#bfdbfe"/>
      <stop offset="45%" stop-color="#3b82f6"/>
      <stop offset="100%" stop-color="#1e40af"/>
    </linearGradient>
    <linearGradient id="silk-b" x1="56" y1="8" x2="8" y2="56" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#93c5fd"/>
      <stop offset="100%" stop-color="#2563eb"/>
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="1.2" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>
  <rect width="64" height="64" rx="16" fill="#0f172a"/>
  <circle cx="48" cy="14" r="3" fill="#64748b" opacity="0.55"/>
  <!-- Flowing silk ribbons forming an abstract S -->
  <path d="M14 46 C14 28, 28 22, 32 32 C36 42, 50 38, 50 20" fill="none" stroke="url(#silk-a)" stroke-width="5" stroke-linecap="round" filter="url(#glow)"/>
  <path d="M18 18 C26 10, 40 12, 44 24 C48 36, 34 44, 22 40" fill="none" stroke="url(#silk-b)" stroke-width="3.5" stroke-linecap="round" opacity="0.75"/>
  <path d="M20 50 C32 44, 38 34, 46 28" fill="none" stroke="#60a5fa" stroke-width="2" stroke-linecap="round" opacity="0.45"/>
</svg>
