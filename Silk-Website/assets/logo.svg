<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 220 48" role="img" aria-label="Silk">
  <defs>
    <linearGradient id="silk-a" x1="0" y1="0" x2="48" y2="48" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#bfdbfe"/>
      <stop offset="45%" stop-color="#3b82f6"/>
      <stop offset="100%" stop-color="#1e40af"/>
    </linearGradient>
    <linearGradient id="silk-b" x1="48" y1="0" x2="0" y2="48" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#93c5fd"/>
      <stop offset="100%" stop-color="#2563eb"/>
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="0.8" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>
  <!-- Icon -->
  <rect x="0" y="0" width="48" height="48" rx="12" fill="#0f172a"/>
  <circle cx="36" cy="10" r="2.2" fill="#64748b" opacity="0.55"/>
  <path d="M10 35 C10 21, 21 16, 24 24 C27 32, 38 29, 38 15" fill="none" stroke="url(#silk-a)" stroke-width="3.8" stroke-linecap="round" filter="url(#glow)"/>
  <path d="M13 13 C19 7, 30 9, 33 18 C36 27, 26 33, 17 30" fill="none" stroke="url(#silk-b)" stroke-width="2.6" stroke-linecap="round" opacity="0.75"/>
  <!-- Wordmark -->
  <text x="58" y="33" font-family="Segoe UI, system-ui, -apple-system, sans-serif" font-size="28" font-weight="700" fill="#f8fafc" letter-spacing="-0.5">Silk</text>
</svg>
